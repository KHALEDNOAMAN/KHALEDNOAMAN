name: Greet Contributors

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Welcome! Thanks for opening your first issue here! 🎉
            I'll take a look and get back to you soon.
          pr-message: |
            Thanks for your first pull request! 🚀
            I appreciate your contribution and will review it shortly.
