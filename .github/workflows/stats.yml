name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitHub Stats refresh
        run: |
          echo "Refreshing GitHub stats cards..."
          curl -s "https://github-readme-stats.vercel.app/api?username=KHALEDNOAMAN&count_private=true&include_all_commits=true" > /dev/null
          curl -s "https://streak-stats.demolab.com?user=KHALEDNOAMAN" > /dev/null
          curl -s "https://github-readme-activity-graph.vercel.app/graph?username=KHALEDNOAMAN" > /dev/null
          echo "Stats refresh triggered!"
